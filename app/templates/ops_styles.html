<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07110c;
    --bg-2: #0d1a13;
    --panel: rgba(12, 28, 20, 0.82);
    --line: #1f3b2c;
    --amber: #e2b44a;
    --mint: #7ee0a8;
    --red: #ef6b57;
    --mute: #7d947f;
    --text: #dcead9;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(226, 180, 74, 0.08), transparent 50%),
      radial-gradient(900px 400px at 100% 0%, rgba(126, 224, 168, 0.07), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  body::before {
    content: "";
    pointer-events: none;
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(126, 224, 168, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(126, 224, 168, 0.03) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.55), transparent 90%);
  }
  h1, h2, .brand {
    font-family: Oxanium, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  a { color: var(--mint); }
  .wrap { position: relative; z-index: 1; }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 22px 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 22px; margin: 0; color: var(--amber); }
  .brand span { color: var(--mint); }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 12px var(--mint);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.7); }
  }
  .live { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 12px; }
  button, select, input, .ghost {
    font: inherit;
    color: var(--text);
    background: #102418;
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  button, .ghost {
    cursor: pointer;
    padding: 8px 12px;
  }
  button.primary {
    background: var(--amber);
    color: #1a1405;
    border-color: var(--amber);
    font-family: Oxanium, sans-serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  button:hover, .ghost:hover { border-color: var(--mint); }
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
    padding: 16px 22px 24px;
    min-height: calc(100vh - 70px);
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }
  .sys { padding: 16px; }
  .sys h2 { margin: 0 0 14px; font-size: 13px; color: var(--amber); }
  .engine {
    display: grid;
    grid-template-columns: 14px 1fr;
    gap: 8px 10px;
    margin-bottom: 12px;
    font-size: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: #5a6b5c; }
  .dot.on { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
  .dot.off { background: var(--red); }
  .meta { color: var(--mute); font-size: 11px; }
  .stat {
    display: flex;
    justify-content: space-between;
    border-top: 1px dashed var(--line);
    padding: 8px 0;
    font-size: 12px;
  }
  .stat b { color: var(--amber); font-weight: 500; }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px;
    border-bottom: 1px solid var(--line);
  }
  .filters select, .filters input { padding: 7px 8px; min-width: 140px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #163222; white-space: nowrap; }
  th { color: var(--mute); font-weight: 500; position: sticky; top: 0; background: #102418; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: rgba(226, 180, 74, 0.08); }
  tbody tr.active { background: rgba(126, 224, 168, 0.1); }
  .ok { color: var(--mint); }
  .bad { color: var(--red); }
  .warn { color: var(--amber); }
  .table-wrap { overflow: auto; max-height: calc(100vh - 220px); }
  .drawer {
    border-top: 1px solid var(--line);
    padding: 12px 14px;
    display: none;
    font-size: 12px;
  }
  .drawer.open { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 18px; }
  .drawer div span { display: block; color: var(--mute); font-size: 10px; text-transform: uppercase; }
  .empty { padding: 40px 16px; color: var(--mute); text-align: center; }
  .login-shell {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: min(420px, 100%);
    padding: 28px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .card h1 { margin: 0 0 8px; color: var(--amber); font-size: 28px; }
  .card p { color: var(--mute); font-size: 13px; line-height: 1.5; }
  .card form { display: grid; gap: 12px; margin-top: 18px; }
  .card input {
    padding: 12px;
    width: 100%;
  }
  .error { color: var(--red); font-size: 12px; min-height: 16px; }
  .counts { display: flex; gap: 18px; color: var(--mute); font-size: 12px; }
  .counts b { color: var(--text); font-weight: 500; }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .sys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
  }
</style>
